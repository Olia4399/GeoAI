[project]
name = "geoai-spatial"
version = "0.1.0"
description = "GeoAI 空间能力服务层 — Python GIS 分析引擎"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pyproj>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
